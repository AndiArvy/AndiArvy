name: Refresh contribution trace

on:
  push:
    paths:
      - .github/workflows/contribution-trace.yml
      - .github/scripts/contribution_trace.py
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: contribution-trace
  cancel-in-progress: false

jobs:
  render:
    if: github.ref_name == github.event.repository.default_branch && github.repository_owner == github.event.repository.name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Render the contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python3 .github/scripts/contribution_trace.py

      - name: Publish the refreshed image
        run: |
          asset_ref=refs/heads/contribution-assets
          asset_dir="$RUNNER_TEMP/contribution-assets"
          git fetch --no-tags --depth=1 origin "$asset_ref"
          git worktree add --detach "$asset_dir" FETCH_HEAD
          cp assets/contributions.svg "$asset_dir/contributions.svg"

          git -C "$asset_dir" add -- contributions.svg
          if git -C "$asset_dir" diff --cached --quiet; then
            exit 0
          fi

          git -C "$asset_dir" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Refresh contribution trace'
          git -C "$asset_dir" push origin "HEAD:$asset_ref"
