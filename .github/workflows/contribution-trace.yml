name: Refresh contribution trace

on:
  push:
    paths:
      - .github/workflows/contribution-trace.yml
      - .github/scripts/contribution_trace.py
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: contribution-trace
  cancel-in-progress: false

jobs:
  render:
    if: github.ref_name == github.event.repository.default_branch && github.repository_owner == github.event.repository.name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Render the contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python3 .github/scripts/contribution_trace.py

      - name: Publish the refreshed image
        run: |
          if git diff --quiet -- assets/contributions.svg; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/contributions.svg
          git commit -m 'Refresh contribution trace'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
